
name: Daily Darvas Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "30 17 * * 1-5"
      timezone: "America/Chicago"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-darvas.txt

      - name: Run Darvas scanner
        run: python darvas_scanner.py

      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darvas-report
          path: darvas_reports/
          if-no-files-found: warn
          retention-days: 30
